<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Meawland Pet Store</title>
    <meta name="theme-color" content="#56C8D8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;900&family=Chewy&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: linear-gradient(180deg, #f0f8ff 0%, #ffffff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #1e293b;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d4eefc;
        border-radius: 32px;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px -15px rgba(86, 200, 216, 0.2);
      }
      .brand {
        font-family: "Chewy", cursive;
        font-size: 36px;
        color: #56c8d8;
        letter-spacing: 1px;
        margin-bottom: 20px;
        display: inline-block;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: #fff7ed;
        color: #ea580c;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
        border: 1px solid #ffedd5;
      }
      h1 {
        font-size: 24px;
        font-weight: 900;
        color: #0f172a;
        margin-bottom: 12px;
        line-height: 1.3;
      }
      p {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 28px;
        font-weight: 500;
      }
      .btn {
        display: inline-block;
        width: 100%;
        background: #56c8d8;
        color: #ffffff;
        font-weight: 800;
        font-size: 14px;
        padding: 14px 24px;
        border-radius: 20px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 20px -5px rgba(86, 200, 216, 0.4);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #38bdf8;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">MEAWLAND</div>
      <div>
        <span class="badge">🐾 You are Offline</span>
      </div>
      <h1>No Internet Connection</h1>
      <p>
        It seems you have lost your connection. Check your WiFi or mobile data
        to continue exploring pet food, accessories, and grooming essentials.
      </p>
      <button class="btn" onclick="window.location.reload()">
        Retry Connection
      </button>
    </div>
  </body>
</html>
